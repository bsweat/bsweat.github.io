<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography - Brandon Sweat</title>
  <link rel="stylesheet" href="assets/css/editorial.css">
</head>
<body>
<header class="masthead" data-masthead></header>
<main class="page" id="main"><h1 class="sr-only">Photographs</h1>

  <div class="toolbar"><div class="filters"><button class="filter-btn active" onclick="filterGallery('all',this)">All</button><button class="filter-btn" onclick="filterGallery('portrait',this)">Portraits</button><button class="filter-btn" onclick="filterGallery('couple',this)">Couples</button><button class="filter-btn" onclick="filterGallery('landscape',this)">Landscape</button></div><span class="count" id="photo-count">35 photos</span></div>
  <section class="photo-grid" id="gallery" aria-live="polite"></section>
</main>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photograph viewer" tabindex="-1" onclick="closeLightbox()"><div class="lightbox-inner" onclick="event.stopPropagation()"><button class="lightbox-close" onclick="closeLightbox()">Close</button><div id="lightbox-content"></div></div></div>
<footer class="site-footer" data-footer></footer>
<script src="assets/js/editorial.js"></script>
<script>
  const photos = [
    { cat:'portrait',  src:'photos/DSC04529.jpg', caption:'Zion golden hour portrait',              aspect:0.75 },
    { cat:'landscape', src:'photos/DSC08004.jpg', caption:'Zion Canyon Valley, Southern Utah',      aspect:1.5  },
    { cat:'couple',    src:'photos/DSC09524.jpg', caption:'Couple at Angels Landing, Zion',         aspect:1.5  },
    { cat:'couple',    src:'photos/DSC05433.jpg', caption:'Engagement session, Snow Canyon',        aspect:0.75 },
    { cat:'portrait',  src:'photos/DSC06262.jpg', caption:'Red rock portrait, Southern Utah',       aspect:0.75 },
    { cat:'couple',    src:'photos/DSC05462.jpg', caption:'Couples session, Snow Canyon',           aspect:1.5  },
    { cat:'landscape', src:'photos/DSC03664.jpg', caption:'Scottish highlands & loch',              aspect:0.67 },
    { cat:'couple',    src:'photos/DSC03895.jpg', caption:'Proposal at glacier lagoon, Iceland',    aspect:0.75 },
    { cat:'landscape', src:'photos/DSC04109.jpg', caption:'Bruarfoss waterfall, Iceland',           aspect:1.5  },
    { cat:'portrait',  src:'photos/DSC06517.jpg', caption:'Snow Canyon portrait at golden hour',    aspect:0.75 },
    { cat:'couple',    src:'photos/DSC06012.jpg', caption:'Wedding portrait, Southern Utah',        aspect:0.75 },
    { cat:'landscape', src:'photos/DSC06311.jpg', caption:'Joshua Tree at sunrise',                 aspect:1.5  },
    { cat:'portrait',  src:'photos/DSC00291.jpg', caption:'Graduation portrait',                    aspect:0.67 },
    { cat:'couple',    src:'photos/DSC04508.jpg', caption:'Family session, Zion National Park',     aspect:1.5  },
    { cat:'landscape', src:'photos/DSC03749.jpg', caption:'Gljufrabui waterfall cave, Iceland',     aspect:1.5  },
    { cat:'portrait',  src:'photos/DSC00498.jpg', caption:'Graduation portraits',                   aspect:0.67 },
    { cat:'couple',    src:'photos/DSC05395.jpg', caption:'Wedding first dance, Southern Utah',     aspect:0.75 },
    { cat:'landscape', src:'photos/DSC04384.jpg', caption:'Eiffel Tower from the Seine, Paris',     aspect:0.67 },
    { cat:'portrait',  src:'photos/DSC06388.jpg', caption:'Senior portrait, mountain creek',        aspect:0.75 },
    { cat:'couple',    src:'photos/DSC08424.jpg', caption:'Family fall session, Southern Utah',     aspect:1.5  },
    { cat:'landscape', src:'photos/DSC06326.jpg', caption:'Rock climbing, Red Rock Canyon',         aspect:1.5  },
    { cat:'portrait',  src:'photos/DSC00907.jpg', caption:'Graduation portrait at the library',     aspect:0.67 },
    { cat:'landscape', src:'photos/DSC08172.jpg', caption:'Wild horse, autumn colors',              aspect:0.67 },
    { cat:'couple',    src:'photos/DSC02887.jpg', caption:'Couples session, outdoor garden',        aspect:0.75 },
    { cat:'landscape', src:'photos/DSC04331.jpg', caption:'Louvre & Arc de Triomphe, Paris',        aspect:1.6  },
    { cat:'portrait',  src:'photos/DSC02257.jpg', caption:'Floral portrait session',                aspect:0.75 },
    { cat:'landscape', src:'photos/DSC06313.jpg', caption:'Joshua Tree boulders at dusk',           aspect:1.5  },
    { cat:'couple',    src:'photos/DSC09218.jpg', caption:'Family session, autumn cottonwoods',     aspect:0.75 },
    { cat:'landscape', src:'photos/DSC03425.jpg', caption:'Raven on the coastal cliffs, Iceland',   aspect:0.67 },
    { cat:'portrait',  src:'photos/DSC06780.jpg', caption:'Graduation portrait, mountain meadow',   aspect:0.75 },
    { cat:'landscape', src:'photos/DSC06442.jpg', caption:'Bouldering at Joshua Tree',              aspect:1.5  },
    { cat:'landscape', src:'photos/DSC04208.jpg', caption:'Church at Vik, Iceland',                 aspect:0.67 },
    { cat:'landscape', src:'photos/DSC06677.jpg', caption:'Joshua Tree desert, California',         aspect:1.5  },
    { cat:'landscape', src:'photos/DSC04791.jpg', caption:'Snow-covered forest, Pacific Northwest', aspect:1.5  },
    { cat:'landscape', src:'photos/DSC07778.jpg', caption:'Wigwam Motel, Route 66',                 aspect:1.6  },
  ];
  // Shuffle once per page load; filters and lightbox share this order.
  for (let i = photos.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [photos[i], photos[j]] = [photos[j], photos[i]];
  }
  function thumbSrc(s) { return s.replace('photos/', 'photos/thumbs/'); }
  function medSrc(s) { return s.replace('photos/', 'photos/medium/'); }

  function renderGallery(filter) {
    const filtered = photos.filter(p => filter === 'all' || p.cat === filter);
    document.getElementById('photo-count').textContent = filtered.length + ' photo' + (filtered.length !== 1 ? 's' : '');
    document.getElementById('gallery').innerHTML = filtered.map((p, pos) => {
      const idx = photos.indexOf(p);
      return `<button class="photo-item" data-cat="${p.cat}" onclick="openLightbox(${idx})"><img src="${thumbSrc(p.src)}" alt="${p.caption}" loading="${pos < 8 ? 'eager' : 'lazy'}" decoding="async"><span class="photo-overlay"><span class="photo-caption">${p.caption}</span></span></button>`;
    }).join('');
  }
  function filterGallery(cat, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGallery(cat);
  }
  function openLightbox(idx) {
    const p = photos[idx];
    document.getElementById('lightbox-content').innerHTML = `<img src="${medSrc(p.src)}" alt="${p.caption}">`;
    document.getElementById('lightbox').classList.add('open'); window.photoReturnFocus = document.activeElement; document.querySelector('.lightbox-close').focus(); document.getElementById('lightbox-content').insertAdjacentHTML('beforeend', '<p class="lightbox-caption">' + p.caption + '</p>');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); document.body.style.overflow = ''; window.photoReturnFocus?.focus(); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
  renderGallery('all');
if (['portrait','couple','landscape'].includes(location.hash.slice(1))) { const cat=location.hash.slice(1); const buttons=[...document.querySelectorAll('.filter-btn')]; filterGallery(cat, buttons[['all','portrait','couple','landscape'].indexOf(cat)]); }
</script>
</body>
</html>
